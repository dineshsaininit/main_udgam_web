<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <defs>
    <linearGradient id="kraftonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
  </defs>
  <!-- Background subtle glow backing -->
  <rect x="0" y="0" width="360" height="80" rx="8" fill="transparent" />
  <!-- KRAFTON Brand Typography -->
  <text x="180" y="52" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="7">KRAFTON</text>
  <!-- Iconic Krafton orange brand indicator bar -->
  <rect x="42" y="68" width="276" height="5" rx="2.5" fill="url(#kraftonOrange)" />
